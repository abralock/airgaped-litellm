apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Database step: apply first on every release (Postgres + migrations), wait for the
# Job to complete, then apply ../ (docs/rollout.md).
namespace: litellm-test
resources:
  - ../../../base/migrate
images:
  - name: ghcr.io/abralock/airgaped-litellm
    newName: REPLACE_ME_HARBOR/airgaped-litellm
  - name: ghcr.io/abralock/airgaped-litellm-postgres
    newName: REPLACE_ME_HARBOR/airgaped-litellm-postgres
