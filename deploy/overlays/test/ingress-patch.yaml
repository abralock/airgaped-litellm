apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
spec:
  ingressClassName: REPLACE_ME_INGRESS_CLASS   # e.g. nginx
  tls:
    - hosts: [REPLACE_ME_HOSTNAME]             # e.g. litellm.example.internal
      secretName: REPLACE_ME_TLS_SECRET         # TLS Secret in this namespace
  rules:
    - host: REPLACE_ME_HOSTNAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
