apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The database step, applied first on every release (and on the first install):
# makes sure Postgres exists, then runs the database migrations once. Only after
# the Job completes is the gateway (DISABLE_SCHEMA_UPDATE=true) rolled out.
labels:
  - pairs:
      app.kubernetes.io/part-of: airgaped-litellm
resources:
  - ../postgres
  - job.yaml
images:
  - name: ghcr.io/abralock/airgaped-litellm
    newTag: unreleased
  - name: ghcr.io/abralock/airgaped-litellm-postgres
    newTag: unreleased
