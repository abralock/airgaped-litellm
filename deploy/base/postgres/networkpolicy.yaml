# Postgres accepts connections only from the gateway, the migration, backup and key-expiry jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-migrate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-key-expiry
      ports:
        - port: 5432
          protocol: TCP
