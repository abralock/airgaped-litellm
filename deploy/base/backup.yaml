apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
# Nightly logical backup of the LiteLLM database (users, keys, spend). Keeps 7 days.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-backup
  labels:
    app.kubernetes.io/name: litellm-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: litellm-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/abralock/airgaped-litellm-postgres
              command: ["/bin/sh", "-ec"]
              args:
                - >-
                  pg_dump -Fc -h litellm-postgres -U litellm -d litellm
                  -f /backups/litellm-$(date -u +%Y%m%dT%H%M%SZ).dump
                  && find /backups -name '*.dump' -mtime +6 -delete
                  && ls -l /backups
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: litellm-postgres
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: litellm-backups
