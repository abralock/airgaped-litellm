name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the Dockerfile (before pushing anything)
        run: |
          zero="sha256:$(printf '0%.0s' $(seq 64))"
          scripts/stamp-release.sh "$TAG" "$zero" "$zero" "$RUNNER_TEMP/tag-check"

      - name: Image names and tags
        id: meta
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          litellm="ghcr.io/$owner/airgaped-litellm"
          postgres="ghcr.io/$owner/airgaped-litellm-postgres"
          # Release candidates (v1.2.3-rc1) never move :latest.
          latest=true
          if [[ "$TAG" == *-rc* ]]; then latest=false; fi
          litellm_tags="$litellm:$TAG"
          if [ "$latest" = true ]; then litellm_tags="$litellm_tags,$litellm:latest"; fi
          {
            echo "litellm=$litellm"
            echo "postgres=$postgres"
            echo "latest=$latest"
            echo "litellm_tags=$litellm_tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push LiteLLM image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.litellm_tags }}

      - name: Copy pinned Postgres image
        id: postgres
        env:
          POSTGRES_IMAGE: ${{ steps.meta.outputs.postgres }}
          LATEST: ${{ steps.meta.outputs.latest }}
        run: |
          # shellcheck disable=SC1091
          source versions.env
          tags=(-t "$POSTGRES_IMAGE:$TAG")
          if [ "$LATEST" = true ]; then tags+=(-t "$POSTGRES_IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "$POSTGRES_UPSTREAM"
          digest="$(docker buildx imagetools inspect "$POSTGRES_IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy bundle
        env:
          LITELLM_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
          LITELLM_IMAGE: ${{ steps.meta.outputs.litellm }}
          POSTGRES_IMAGE: ${{ steps.meta.outputs.postgres }}
        run: |
          scripts/stamp-release.sh "$TAG" "$LITELLM_DIGEST" "$POSTGRES_DIGEST" dist
          bundle="airgaped-litellm-deploy-$TAG.tar.gz"
          mkdir -p dist/scripts && cp scripts/smoke_test.py dist/scripts/
          tar -C dist -czf "dist/$bundle" deploy scripts/smoke_test.py
          (cd dist && sha256sum "$bundle" > "$bundle.sha256")
          cat > dist/notes.md <<NOTES
          ## Images

          | Image | Reference |
          | --- | --- |
          | LiteLLM gateway | \`$LITELLM_IMAGE:$TAG@$LITELLM_DIGEST\` |
          | Postgres | \`$POSTGRES_IMAGE:$TAG@$POSTGRES_DIGEST\` |

          The gateway image is linux/amd64 and linux/arm64; the Postgres image carries every
          platform the upstream image has.

          ## Import into Harbor (keeps these digests)

          \`\`\`sh
          skopeo copy --all --preserve-digests docker://$LITELLM_IMAGE@$LITELLM_DIGEST oci:airgaped-litellm:$TAG
          skopeo copy --all --preserve-digests docker://$POSTGRES_IMAGE@$POSTGRES_DIGEST oci:airgaped-litellm-postgres:$TAG
          # scan both OCI directories, then:
          skopeo copy --all --preserve-digests oci:airgaped-litellm:$TAG docker://<harbor>/<project>/airgaped-litellm:$TAG
          skopeo copy --all --preserve-digests oci:airgaped-litellm-postgres:$TAG docker://<harbor>/<project>/airgaped-litellm-postgres:$TAG
          \`\`\`

          Harbor should then show the same digests as above. See docs/rollout.md step 2.

          ## Deploy bundle

          \`$bundle\` contains \`deploy/\` with these images pinned, and
          \`scripts/smoke_test.py\`. Verify it with
          \`sha256sum -c $bundle.sha256\`, then follow docs/rollout.md.
          NOTES

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/airgaped-litellm-deploy-*.tar.gz
            dist/airgaped-litellm-deploy-*.tar.gz.sha256

      - name: Check images can be pulled without logging in
        env:
          LITELLM_IMAGE: ${{ steps.meta.outputs.litellm }}
          POSTGRES_IMAGE: ${{ steps.meta.outputs.postgres }}
        run: |
          docker logout ghcr.io
          for image in "$LITELLM_IMAGE:$TAG" "$POSTGRES_IMAGE:$TAG"; do
            if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              echo "::warning::$image is not public yet. On GitHub: Package settings -> Change visibility -> Public (once per package)."
            fi
          done
